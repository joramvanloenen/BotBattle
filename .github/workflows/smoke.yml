name: Browser physics smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check src/app.js
      - run: npx playwright test tests/smoke.spec.cjs --workers=1
